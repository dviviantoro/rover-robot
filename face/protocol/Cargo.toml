[package]
name = "robot-face-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "What robot-core says, and what the panel should therefore show. No UI, no sockets."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Nothing. If a test here needs a display, a socket or a clock, it belongs in app/.
