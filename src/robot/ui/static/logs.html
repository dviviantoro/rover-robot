<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot — Logs</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* A source whose service is not running: still reachable, because the reason it is
     down is in its log -- but no longer competing with the ones that are live. */
  .tabs button.dim .offdot {
    display: inline-block; width: 0.4rem; height: 0.4rem; border-radius: 999px;
    background: var(--danger); margin-left: 0.35rem; vertical-align: 0.05rem;
  }
  .line .src { color: var(--violet); }
</style>
<style>
  .toolbar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.9rem; }
  .toolbar select, .toolbar input[type="text"] { width: auto; }
  .toolbar .grow { flex: 1; min-width: 10rem; }

  #stream {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.775rem;
    line-height: 1.5; height: 62vh; overflow-y: auto; padding: 0.75rem 0.9rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    white-space: pre-wrap; word-break: break-word;
  }
  #stream:empty::before { content: "Waiting for log lines…"; color: var(--text-faint); }
  .line { display: flex; gap: 0.6rem; padding: 0.08rem 0; border-radius: 4px; }
  .line:hover { background: var(--surface-2); }
  .line time { color: var(--text-faint); flex-shrink: 0; }
  .line .lvl { flex-shrink: 0; width: 4.2rem; font-weight: 700; }
  .line .src { flex-shrink: 0; color: var(--violet); }
  .line .msg { flex: 1; }
  .DEBUG   .lvl { color: var(--text-faint); }
  .INFO    .lvl { color: var(--info); }
  .WARNING .lvl { color: var(--warning); }
  .ERROR   .lvl, .CRITICAL .lvl { color: var(--danger); }
  .ERROR, .CRITICAL { background: var(--danger-soft); }
  .line .exc { color: var(--danger); }
  .hidden { display: none; }
  .counts { font-size: 0.76rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-page="logs">
<nav class="sidebar"></nav>
<div class="page wide">
  <h1>Logs</h1>
  <p class="hint measure">A dimmed source is a service that is not running — its log is still where the reason will be.</p>

  <div class="toolbar">
    <div class="tabs" id="source-seg"></div>
    <span class="tabs" id="level-seg">
      <button data-level="DEBUG">Debug</button>
      <button data-level="INFO" class="on">Info</button>
      <button data-level="WARNING">Warn</button>
      <button data-level="ERROR">Error</button>
    </span>
    <input type="text" id="filter" class="grow" placeholder="filter text…">
    <button id="pause" class="btn-secondary">Pause</button>
    <button id="clear" class="btn-ghost">Clear</button>
  </div>

  <div class="toolbar">
    <span class="counts" id="counts"></span>
    <span class="spacer"></span>
    <span class="counts">orchestrator log level</span>
    <span class="tabs" id="setlevel-seg">
      <button data-set="DEBUG">Debug</button>
      <button data-set="INFO">Info</button>
      <button data-set="WARNING">Warn</button>
    </span>
  </div>
  <p class="hint measure" id="level-note" style="margin-top:-0.4rem">Debug logs the model's raw reply before any stripping.</p>

  <div id="stream"></div>
</div>
<script src="/app.js"></script>
<script src="/logs.js"></script>
</body>
</html>
