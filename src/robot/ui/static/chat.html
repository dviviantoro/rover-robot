<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot — Chat</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* The composer is pinned to the bottom of the viewport and only the history scrolls.
     It used to be `position: sticky` inside a page that scrolls as a whole, which keeps
     it visible but still moves it -- and with the sidebar the scroll container changed
     again. A column that owns the viewport height is the thing that actually holds it
     still: `#messages` is the only scroller on the page. */
  body[data-page="chat"] > .page {
    height: 100vh; display: flex; flex-direction: column; padding-bottom: 0;
  }
  /* The full 72rem, like every other page. A reading measure was the typographically
     better choice and the wrong one here: this page is read beside the robot's own
     output and asked to match the rest of the dashboard. */
  /* A short conversation sits on the composer and grows upwards rather than hanging from
     the top of an empty column. `margin-top:auto` on the first child and NOT
     `justify-content:flex-end`: the latter clips the top of an overflowing scroller and
     puts it out of reach of the scrollbar. This resolves to 0 once the content is taller
     than the box, so nothing is ever lost. */
  #messages { display: flex; flex-direction: column; }
  #messages > *:first-child { margin-top: auto; }
  #messages { flex: 1 1 auto; overflow-y: auto; min-height: 0;
              padding-bottom: 0.75rem; scrollbar-gutter: stable; }
  #messages:empty::before {
    content: "Type below. Replies appear here only — for a spoken conversation, use Headless.";
    color: var(--text-faint); font-size: 0.88rem;
  }
  .turn { padding: 0.7rem 0.95rem; border-radius: var(--radius-sm); font-size: 0.92rem;
          line-height: 1.5; margin-bottom: 0.6rem; }
  .turn.you { background: var(--surface-2); border: 1px solid var(--border); }
  .turn.robot { background: var(--accent-soft); }
  .turn .who { font-weight: 700; font-size: 0.7rem; text-transform: uppercase;
               letter-spacing: 0.05em; opacity: 0.7; display: block; margin-bottom: 0.2rem; }
  .turn .lang { float: right; font-weight: 600; opacity: 0.75; }
  .wire { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.76rem;
          color: var(--warning-soft-text); background: var(--warning-soft);
          border-radius: var(--radius-sm); padding: 0.35rem 0.6rem; margin-bottom: 0.6rem; }
  .note { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.6rem; font-style: italic; }
  .meta { font-size: 0.72rem; color: var(--text-faint); margin: -0.3rem 0 0.7rem 0.2rem; }
  #composer {
    flex: 0 0 auto; display: flex; gap: 0.6rem; align-items: flex-end;
    padding: 0.8rem 0 1.1rem; background: var(--bg);
    border-top: 1px solid var(--border);
  }
  #chat-input { resize: none; max-height: 9rem; }
  #composer button { flex: 0 0 auto; }
  .statusline { flex: 0 0 auto; }
</style>
</head>
<body data-page="chat">
<nav class="sidebar"></nav>
<div class="page">
  <div class="statusline">
    <span class="dot" id="live-dot"></span><span id="live-text">connecting…</span>
    <span class="controls">
      <button id="interrupt" class="btn-danger" title="Abandon the reply being generated">Stop</button>
      <button id="clear" class="btn-ghost">Clear</button>
    </span>
  </div>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="chat-input" rows="1" placeholder="Ask the robot anything…" autofocus></textarea>
    <button class="btn-primary" type="submit">Send</button>
  </form>
</div>
<script src="/app.js"></script>
<script src="/chat.js"></script>
</body>
</html>
