# The same handbook on Read the Docs, as an alternative to GitHub Pages (.github/workflows/docs.yml).
# Use ONE of the two: import the repository at readthedocs.org and it reads this file.
# Build-time tooling only. Nothing here touches the robot.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: requirements-docs.txt
