<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Which way each mecanum wheel turns for each motion</title>
<desc id="d">Three top views of a four-wheel mecanum robot, front up. Forward: all four wheels turn forward. Strafe left, a positive vy: front-left and rear-right turn backward, front-right and rear-left turn forward. Turn left, a positive omega: both left wheels turn backward and both right wheels turn forward.</desc>
