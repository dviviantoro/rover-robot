<rect x="893.1" y="729.5" width="33.8" height="18.7" rx="9.3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="910" y="743.96" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">DRM</text>
<text x="30" y="828" font-size="12" font-weight="400" text-anchor="start" fill="#475569">Start order (scripts/run_stack.sh): robot-llm, [robot-embed], robot-whisper, robot-tts, robot-vision, robot-core, robot-asr, then robot-ui / robot-face.</text>
<text x="30" y="846" font-size="12" font-weight="400" text-anchor="start" fill="#475569">Under systemd the same nine are units in deploy/systemd/, grouped by robot.target. robot-ui and robot-face can die without the robot noticing.</text>
