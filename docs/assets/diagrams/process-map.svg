<text x="365" y="559.96" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">run/vision.sock</text>
<line x1="720" y1="349" x2="940" y2="349" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/>
