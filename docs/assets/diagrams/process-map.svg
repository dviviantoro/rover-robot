<line x1="606" y1="600" x2="606" y2="580" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<path d="M95 656 v24 a55.0 6 0 0 0 110 0 v-24 a55.0 6 0 0 0 -110 0 a55.0 6 0 0 0 110 0" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="150.0" y="675.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1e293b">faces.db</text>
<line x1="150" y1="650" x2="150" y2="618" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<rect x="940" y="190" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1050.0" y="214" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">robot-embed</text>
<text x="1050.0" y="233" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">llama.cpp --embeddings :8082</text>
<text x="1050.0" y="249" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">only while ingesting</text>
<rect x="940" y="310" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1050.0" y="334" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">robot-llm</text>
<text x="1050.0" y="353" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">llama.cpp server :8080</text>
<text x="1050.0" y="369" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">the language model, GPU</text>
<rect x="940" y="440" width="220" height="78" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1050.0" y="464" font-size="16" font-weight="700" text-anchor="middle" fill="#78350f">Body (ESP32)</text>
<text x="1050.0" y="483" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">USB serial cable</text>
<text x="1050.0" y="499" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">motors, face, sensors</text>
<rect x="330" y="720" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="440.0" y="744" font-size="16" font-weight="700" text-anchor="middle" fill="#064e3b">robot-ui</text>
<text x="440.0" y="763" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">web dashboard :8081</text>
<text x="440.0" y="779" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">NiceGUI, optional</text>
<rect x="650" y="720" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="760.0" y="744" font-size="16" font-weight="700" text-anchor="middle" fill="#064e3b">robot-face</text>
<text x="760.0" y="763" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">panel on the robot's screen</text>
<text x="760.0" y="779" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">Rust + Slint, optional</text>
<rect x="40" y="720" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="150.0" y="744" font-size="16" font-weight="700" text-anchor="middle" fill="#064e3b">Browser</text>
<text x="150.0" y="763" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">any device on the network</text>
<text x="150.0" y="779" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">HTTP :8081, login</text>
<rect x="940" y="720" width="220" height="78" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1050.0" y="744" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">Screen</text>
<text x="1050.0" y="763" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">HDMI / DisplayPort</text>
<text x="1050.0" y="779" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">drawn straight to DRM/KMS</text>
