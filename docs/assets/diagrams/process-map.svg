<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Process map of the Jetson side</title>
<desc id="d">robot-core sits in the middle and talks to every other process: robot-asr and robot-tts and robot-vision over unix sockets, robot-llm and robot-embed over HTTP, the microcontroller over a USB serial cable, and robot-ui and robot-face over a local WebSocket on port 8090. robot-asr sends audio to robot-whisper over HTTP on port 8083.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="arr-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="859" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="30" y="40" font-size="22" font-weight="700" text-anchor="start" fill="#0f172a">Process map: who talks to whom, and over what</text>
<text x="30" y="64" font-size="13" font-weight="400" text-anchor="start" fill="#475569">robot-core is the hub, and the only process that talks to the body. Every arrow is a local connection.</text>
<rect x="40" y="150" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="150.0" y="174" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">robot-whisper</text>
<text x="150.0" y="193" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">whisper.cpp server :8083</text>
<text x="150.0" y="209" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">speech to text, on the GPU</text>
<rect x="40" y="310" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="150.0" y="334" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">robot-asr</text>
<text x="150.0" y="353" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">USB mic, voice detector,</text>
<text x="150.0" y="369" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">noise gates</text>
<rect x="40" y="420" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="150.0" y="444" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">robot-tts</text>
<text x="150.0" y="463" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">Supertonic voice, on the GPU</text>
<text x="150.0" y="479" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">plays through the USB speaker</text>
<rect x="40" y="540" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="150.0" y="564" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">robot-vision</text>
<text x="150.0" y="583" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">CSI camera: objects + faces</text>
<text x="150.0" y="599" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">on the CPU (optional)</text>
<rect x="490" y="300" width="230" height="280" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="605.0" y="334" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3a8a">robot-core</text>
<text x="605.0" y="356" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">the orchestrator (asyncio)</text>
<text x="605.0" y="392" font-size="12" font-weight="400" text-anchor="middle" fill="#1e3a8a">turn flow and barge-in</text>
<text x="605.0" y="411" font-size="12" font-weight="400" text-anchor="middle" fill="#1e3a8a">reply parsing, face phases</text>
<text x="605.0" y="430" font-size="12" font-weight="400" text-anchor="middle" fill="#1e3a8a">knowledge + people</text>
<text x="605.0" y="449" font-size="12" font-weight="400" text-anchor="middle" fill="#1e3a8a">keepalive, health, settings</text>
<text x="605.0" y="468" font-size="12" font-weight="400" text-anchor="middle" fill="#1e3a8a">serial link + heartbeat</text>
