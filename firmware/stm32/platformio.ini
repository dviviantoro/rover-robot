; PlatformIO project for the robot body.
;
; The portable core (protocol.c, mecanum.c, watchdog.c, pid.c, robot.c) has no HAL
; dependency and is also compiled for the host by run_native_tests.sh and by
; tools/stm32_sim. Only board_stm32.cpp and main.cpp are target-specific.
;
;   pio run                 build for the STM32
;   pio run -t upload       flash it
;   pio device monitor      watch the serial link
;   ./run_native_tests.sh   run the core's tests on this machine (no hardware)

[platformio]
default_envs = blackpill_f411ce

[env]
; STM32duino rather than raw CubeHAL: TECH_STACK.md permits either, and the Arduino
; core brings working USB-CDC, PWM and interrupt attach out of the box. The parts that
; matter for safety live in the portable C core, not in the framework.
platform = ststm32
framework = arduino
build_flags =
    -Wall
    -Wextra
    -Iinclude
    ; USB CDC: the STM32 must enumerate as /dev/ttyACM* (serial-protocol.md).
    -DUSBCON
    -DUSBD_USE_CDC
    -DUSBD_VID=0x0483            ; STMicroelectronics -- scripts/bringup/check_board.sh
    -DUSB_MANUFACTURER="\"Robot\""
    -DUSB_PRODUCT="\"RobotBody\""
monitor_speed = 115200
monitor_port = /dev/ttyACM0

[env:blackpill_f411ce]
board = blackpill_f411ce
; Any F4-class board with USB works; change `board` and firmware/stm32/include/pins.h
; together. PROJECT_BRIEF.md calls for "F4-class or better".

[env:nucleo_f411re]
board = nucleo_f411re
